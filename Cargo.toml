[package]
name = "axon"
version = "0.1.0"
edition = "2021"
description = "Agent Execution Axon & Shared-Memory SSA Register VM"

[[bin]]
name = "ax"
path = "src/main.rs"

[lib]
name = "axon"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"
ignore = "0.4"
globset = "0.4"
regex = "1.11"
anyhow = "1.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.13"
